# Allowed external URL prefixes for charge-transparency live links.
#
# A matching URL is fetched without asking. Other public HTTPS origins are
# offered to the user once per origin and can be remembered or denied. The
# Electron main process still checks protocol, resolved addresses, redirects,
# response size and response type for every request.
#
# Reload mode (optional, default "open"):
#   mode open     Offer uncovered public HTTPS origins to the user.
#   mode strict   Never offer or fetch uncovered origins.
#
# Format: [mode open|strict] and <URL-prefix> <max-payload-size-in-kbytes> lines
# Example:
# mode strict
# https://api.example.org/ctrs/ 100
